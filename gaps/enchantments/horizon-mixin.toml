# SPDX-License-Identifier: MIT
# horizon-gaps `enchantments`: a mod's own namespace's and a world's data packs' enchantments join the registry.
# README.md says what Horizon lacks and how this fills it.
[mod]
id = "gap-enchantments"
version = "0.1.0"
priority = 100

[compatibility]
horizon_revision = "3fb4c3138e0c5d8fdd2fdb555cf31368e8897497"

[[module]]
id = "enchantments"
file = "crates/horizon-items/src/enchant.rs"
name = "gap_enchantments"
source = "gap_enchantments.rs"
visibility = "pub"

[[module]]
id = "enchantment-files"
file = "crates/horizon-client/src/game/functions.rs"
name = "gap_enchantment_files"
source = "gap_enchantment_files.rs"

[[injection]]
id = "enchantment-files-hook"
kind = "RETURN"
target = "horizon_client::game::functions::content_overlay"
helper = "gap_enchantment_files_hook.rs"
bindings = [
  { name = "files", ty = "Vec<(String, Vec<Vec<u8>>)>", value = "$value" },
  { name = "world_root", ty = "&std::path::Path", value = "world_root" },
  { name = "resources", ty = "&std::path::Path", value = "resources" },
  { name = "vanilla_disabled", ty = "bool", value = "vanilla_disabled" },
  { name = "enabled_features", ty = "&[String]", value = "enabled_features" },
]

[[injection]]
id = "enchantments-hook"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_tick"
helper = "gap_enchantments_hook.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]
