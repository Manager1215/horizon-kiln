# A nightly build of Kiln from main (D-070): tools/package.sh, tagged nightly-<date>-<sha>, published as a prerelease
# in Manager1215/horizon-kiln-nightly, a public repository that holds releases only. Needs the secret NIGHTLY_TOKEN
# (a fine-grained token for that repository, Contents: read and write); without it the build stays an artifact.
# The public repository Manager1215/horizon-kiln keeps stable releases only (D-032); nothing here touches it.
name: Nightly

on:
  schedule:
    - cron: "15 4 * * *"
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'Manager1215/horizon-kiln-dev'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: horizon-mods, for native.py package
        run: |
          git clone --quiet --depth 1 https://github.com/horizon-rust/horizon-mods .deps/horizon-mods
          ln -s ../../../kiln .deps/horizon-mods/native/kiln

      - name: The tag
        id: tag
        run: echo "tag=nightly-$(date -u +%Y-%m-%d)-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Package main
        run: sh tools/package.sh "${{ steps.tag.outputs.tag }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.tag.outputs.tag }}
          path: dist/
          retention-days: 14

      - name: Publish the prerelease in horizon-kiln-nightly
        env:
          GH_TOKEN: ${{ secrets.NIGHTLY_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "No NIGHTLY_TOKEN: the build is this run's artifact."; exit 0; fi
          notes="Kiln from main at $(git rev-parse --short HEAD), $(date -u +%Y-%m-%d). A development build: it can break and promises nothing; the latest stable release is at https://github.com/Manager1215/horizon-kiln/releases. What this build runs: https://horizon-kiln.cc/mods.html?build=dev"
          gh release create "$TAG" dist/*.zip dist/*.jar dist/SHA256SUMS --repo Manager1215/horizon-kiln-nightly \
            --prerelease --title "Kiln $TAG" --notes "$notes"
