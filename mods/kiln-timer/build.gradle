plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"kiln_timer" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

// The timer in real Minecraft 26.3 with Fabric: `./gradlew runClientGameTest` opens the game, makes a world and
// plays a run with commands (src/gametest/).
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "kiln_timer_test"
		enableGameTests = false
		enableClientGameTests = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// The timer's core (src/main/java/.../core) is plain Java: its tests need no game.
	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("../../LICENSE") {
		rename { "LICENSE_kiln_timer" }
	}
}
