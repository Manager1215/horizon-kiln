[mod]
id = "kiln"
version = "0.2.0"
priority = 100

# The commit it was tested on. Besides the native hook points (hooks 80 in compatibility.json: using an item, the acting
# player, a player's tick, respawn and leaving), horizon.rs reads a few of the game's own fields and changes the acting player's attributes, health and hands
# (docs/VISION.md, internal/server-side.md), and the structure patches below hook three of its functions (D-049): a new
# Nightly can need them updated.
[compatibility]
horizon_revision = "c9d474dd9116e84c243f8992d75c11314df56f06"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "kiln"
source = "runtime.rs"

[[module]]
id = "jvm"
file = "crates/horizon-client/src/game.rs"
name = "kiln_jvm"
source = "jvm.rs"

[[module]]
id = "horizon"
file = "crates/horizon-client/src/game.rs"
name = "kiln_horizon"
source = "horizon.rs"

[[module]]
id = "structures"
file = "crates/horizon-client/src/game.rs"
name = "kiln_structures"
source = "structures.rs"

[[module]]
id = "loot"
file = "crates/horizon-client/src/game.rs"
name = "kiln_loot"
source = "loot.rs"

[[injection]]
id = "tick"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_tick"
helper = "tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

[[injection]]
id = "frame"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_frame"
helper = "frame.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "elapsed", ty = "std::time::Duration", value = "elapsed" },
]

[[injection]]
id = "key"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_key"
helper = "key.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "key", ty = "&str", value = "key" },
  { name = "pressed", ty = "bool", value = "pressed" },
]

[[injection]]
id = "hud"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_hud"
helper = "hud.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *batch" },
  { name = "corners", ty = "&mut horizon_client::extras_hud::Corners", value = "&mut *corners" },
]

# A Java mod's item used on the integrated server (D-052): Kiln runs the mod's Item.use.
[[injection]]
id = "use-item"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_use_item"
helper = "use_item.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "stack", ty = "&horizon_client::items::ItemStack", value = "stack" },
  { name = "claimed", ty = "&mut bool", value = "&mut *claimed" },
]

# A player new to a level (joining, changing dimension), respawning, leaving: Fabric's server player events (D-052).
[[injection]]
id = "player-tick"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_player_tick"
helper = "player_tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

[[injection]]
id = "player-respawned"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_player_respawned"
helper = "player_respawned.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

[[injection]]
id = "player-logged-out"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_player_logged_out"
helper = "player_logged_out.rs"
bindings = [
  { name = "player", ty = "u128", value = "player" },
]

# A Java mod's blocks (D-052 step 5): a right click, a random tick, a player standing on one.
[[injection]]
id = "right-click-block"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_right_click_block"
helper = "right_click_block.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "face", ty = "[i32; 3]", value = "face" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "random-tick"
kind = "HEAD"
target = "horizon_client::game::native_hooks::GameLevel<'_>::native_random_tick"
helper = "random_tick.rs"
bindings = [
  { name = "level", ty = "&mut crate::game::GameLevel<'_>", value = "&mut *self" },
  { name = "ticks", ty = "&mut horizon_world::level::Ticks", value = "&mut *ticks" },
  { name = "dimension", ty = "horizon_world::level::Dimension", value = "dimension" },
  { name = "pos", ty = "horizon_core::position::BlockPos", value = "pos" },
  { name = "state", ty = "horizon_world::registry::BlockStateId", value = "state" },
  { name = "handled", ty = "&mut bool", value = "&mut *handled" },
]

[[injection]]
id = "step-on"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_block_step_on"
helper = "step_on.rs"
bindings = [
  { name = "dimension", ty = "&str", value = "dimension" },
  { name = "entity", ty = "i32", value = "entity" },
  { name = "kind", ty = "&str", value = "kind" },
  { name = "state", ty = "horizon_world::registry::BlockStateId", value = "state" },
  { name = "position", ty = "[i32; 3]", value = "position" },
]

# A Java mod's blocks, further (D-052 step 5b): a scheduled tick, a neighbour change, the state it is placed in, placing
