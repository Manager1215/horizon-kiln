kind = "HEAD"
target = "horizon_client::game::native_hooks::GameLevel<'_>::native_neighbor_changed"
helper = "neighbor_changed.rs"
bindings = [
  { name = "level", ty = "&crate::game::GameLevel<'_>", value = "&*self" },
  { name = "dimension", ty = "horizon_world::level::Dimension", value = "dimension" },
