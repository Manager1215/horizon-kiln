# Structure mods (D-049): a mod's structure pieces where Horizon looks for templates, its world generation as a data
# pack in every world, made from the jars before a world's packs are read.
[[injection]]
id = "structure-template"
kind = "HEAD"
target = "horizon_world::worldgen::structure::StructureResources::template"
helper = "structure_template.rs"
bindings = [
  { name = "resources", ty = "&StructureResources", value = "&*self" },
  { name = "id", ty = "&str", value = "id" },
]

[[injection]]
id = "datapack"
kind = "RETURN"
target = "horizon_client_render::datapack::discover"
helper = "datapack.rs"
bindings = [{ name = "packs", ty = "Vec<DataPack>", value = "$value" }]

# The Java mods' loot changes (D-052 step 4): loot.rs runs them before a world's packs are read; Horizon's hook for a
# table as it loads (API 75) adds their pools.
[[injection]]
id = "loot-table"
kind = "HEAD"
target = "horizon_world::loot::native_loot_table_load"
helper = "loot_table.rs"
bindings = [
  { name = "id", ty = "&str", value = "id" },
  { name = "table", ty = "&mut serde_json::Value", value = "&mut *table" },
]

